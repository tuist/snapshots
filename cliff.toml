# git-cliff picks the next version and writes the release notes.
# https://git-cliff.org/docs/configuration
#
# Releases are cut by .github/workflows/ci.yml on every push to main that
# contains a releasable commit: `feat` bumps the minor version, `fix`, `perf`,
# and `refactor` bump the patch version. Other commit types (docs, ci, chore,
# test, style, build) don't cut a release on their own.

[remote.github]
owner = "tuist"
repo = "snapshots"

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first | trim }}\
  {% if commit.remote.pr_number %} ([#{{ commit.remote.pr_number }}](https://github.com/tuist/snapshots/pull/{{ commit.remote.pr_number }})){% endif %}\
  {% if commit.breaking %} **(breaking)**{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
tag_pattern = "^[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = ".*", skip = true },
]

[bump]
features_always_bump_minor = true
# Stay on 0.x until we decide to ship 1.0: a breaking change bumps the minor version.
breaking_always_bump_major = false
initial_tag = "0.1.0"
