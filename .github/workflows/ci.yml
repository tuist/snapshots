name: CI

# Every push to main is tested and, when it contains a releasable commit
# (feat, fix, perf, refactor; see cliff.toml), tagged and released. SwiftPM
# resolves versions from the tags, so a release needs no other step.

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test
    runs-on: tuist-macos
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Test on macOS
        run: swift test
      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -scheme TuistSnapshots-Package \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  release:
    name: Release
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
      - name: Find the next version
        id: version
        run: |
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          next=$(git cliff --bumped-version 2>/dev/null)
          echo "Latest release: ${latest:-none}, next version: $next"
          if [ -n "$latest" ] && [ "$next" = "$latest" ]; then
            echo "No releasable commits since $latest."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$next" >> "$GITHUB_OUTPUT"
          fi
      - name: Release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git cliff --unreleased --bump --strip all > "$RUNNER_TEMP/notes.md" 2>/dev/null
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
